name: Refresh Profile Telemetry

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-telemetry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate profile telemetry
        run: python3 scripts/generate_profile_telemetry.py
      - name: Commit refreshed assets
        run: |
          if git diff --quiet -- assets/; then
            echo "No telemetry changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-activity-light.svg assets/profile-activity-dark.svg assets/profile-stack-light.svg assets/profile-stack-dark.svg assets/profile-telemetry.json
          git commit -m "chore: refresh profile telemetry"
          git push
